name: Build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore ADOFAI_Auto.sln

      - name: Build (Release / x64)
        run: msbuild ADOFAI_Auto.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

      - name: Package
        shell: pwsh
        run: |
          $out = "KeyboardRecorder/bin/x64/Release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$out/*" dist -Recurse -Exclude *.pdb
          Copy-Item README.md dist
          Compress-Archive -Path dist/* -DestinationPath ADOFAI_Auto.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADOFAI_Auto
          path: ADOFAI_Auto.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ADOFAI_Auto.zip
